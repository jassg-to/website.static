name: Upload files to update Website

on:
  push:
    branches: [ main ]

env:
  AWS_REGION: ca-central-1

permissions:
  id-token: write   # This is required for assuming the AWS role
  contents: read    # This is required for actions/checkout

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:

      - name: Git clone the repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::505559659010:role/Github-JassgTo
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ca-central-1

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run the HTML templates
        run: uv run html/build.py

      - name: Clean up nonpublic files
        run: rm -rf html

      - name: Upload files
        run: aws s3 sync --exclude ".*" --delete --only-show-errors . s3://jassg.ca/

      - name: Clear cache
        run: aws cloudfront create-invalidation --distribution-id E2Q13YEQKCSRNE --paths "/*"
